<!--
  OpenPaint Logo
  矢量 SVG，可在所有主题下使用
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="paintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#a29bfe" />
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#paintGrad)" />
  <!-- 画笔笔尖 -->
  <path
    d="M20 44 L20 36 L36 20 L44 28 L28 44 Z"
    fill="#ffffff"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- 笔尖高光 -->
  <path d="M22 42 L34 30 L36 32 L24 44 Z" fill="rgba(255,255,255,0.65)" />
  <!-- 画笔木柄 -->
  <rect x="38" y="14" width="14" height="6" rx="1.5" transform="rotate(-45 45 17)" fill="#fff5e1" />
  <!-- AI 魔法光点 -->
  <circle cx="48" cy="20" r="2.5" fill="#fdcb6e" />
  <circle cx="14" cy="48" r="1.8" fill="#00b894" />
</svg>