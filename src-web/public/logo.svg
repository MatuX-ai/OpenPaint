<!--
  OpenPaint Logo
  黑白灰极简风格，适配深浅主题
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景圆角方块 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1a1a1e" stroke="#3a3a44" stroke-width="1" />
  <!-- 画笔主体（白色） -->
  <path
    d="M20 44 L20 36 L36 20 L44 28 L28 44 Z"
    fill="#ffffff"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- 笔尖暗部 -->
  <path d="M22 42 L34 30 L36 32 L24 44 Z" fill="rgba(255,255,255,0.5)" />
  <!-- 画笔木柄（灰色） -->
  <rect x="38" y="14" width="14" height="6" rx="1.5" transform="rotate(-45 45 17)" fill="#8a8a92" />
</svg>
