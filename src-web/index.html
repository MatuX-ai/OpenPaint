            }

          {
            "@type": "Question",
            "name": "OpenPaint 支持哪些大模型？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "OpenPaint 内置 9 家 LLM Provider：国内优先 DeepSeek、通义千问（Qwen，阿里云）、智谱 GLM、月之暗面 Kimi、字节豆包 Doubao、MiniMax；海外 OpenAI、Anthropic Claude；本地离线 Ollama。用户自配 API Key，所有调用不经 OpenPaint 中转。"
            }
          },
          {
            "@type": "Question",
            "name": "OpenPaint 是免费的吗？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "是。OpenPaint 主体以 MIT 协议开源，可自由用于个人与商业项目。AI 调用由用户自配 API Key 发起，OpenPaint 不收取任何抽成或订阅费。AI 模型本身的费用由对应厂商按调用量结算。"
            }
          },
          {
            "@type": "Question",
            "name": "我的设计稿会上传到云端吗？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "不会。OpenPaint 默认本地优先：画布状态、图库元数据、设置都保存在本地 SQLite 与文件系统；AI 调用由你配置的 Key 直接发往所选 Provider，OpenPaint 不上传、不缓存你的画布或提示词。本地 Ollama 模式下，全部推理都在本机完成。"
            }
          },
          {
            "@type": "Question",
            "name": "OpenPencil 在 OpenPaint 中扮演什么角色？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "OpenPencil 0.14（@open-pencil/vue SDK）作为右窗引擎嵌入，负责矢量编辑与 AI 图像生成。画布选区可一键送入 OpenPencil 微调，结果回落到中央画布图层并自动归档图库。"
            }
          },
          {
            "@type": "Question",
            "name": "支持哪些操作系统？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Windows 10 / 11（NSIS .exe 与 .msi），macOS 10.15+（.dmg），Linux Ubuntu 20.04+ / Fedora 36+（.deb / AppImage）。Web 端可在浏览器直接试用核心交互。"
            }
          },
          {
            "@type": "Question",
            "name": "如何贡献代码？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fork 仓库 → 本地 pnpm install + pnpm tauri dev → 提交 PR。核心模块（画布、图库、AI 桥接、UI 组件）独立解耦，新功能建议先在 GitHub Discussions 立项。"
            }
          }
        ]
