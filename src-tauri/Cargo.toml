# ============================================================
# OpenPaint 后端依赖（src-tauri/Cargo.toml）
# ============================================================

[package]
name = "openpaint"
version = "0.2.0"
description = "OpenPaint — 开源 AI 原生设计工作台"
authors = ["OpenPaint Contributors"]
edition = "2021"
rust-version = "1.70"
license = "MIT"
repository = "https://github.com/MatuX-ai/OpenPaint"
homepage = "https://github.com/MatuX-ai/OpenPaint"
keywords = ["design", "canvas", "ai", "tauri", "mcp"]
categories = ["multimedia", "graphics", "design"]

# 同时存在 openpaint (桌面端) 与 openpaint-mcp 两个二进制，
# 未显式 --bin 时 cargo run 无法选择；这里将桌面端作为默认入口。
default-run = "openpaint"

# 二进制入口
[[bin]]
name = "openpaint"
path = "src/main.rs"

# MCP 服务器子命令入口（阶段二）
[[bin]]
name = "openpaint-mcp"
path = "src/bin/mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri 核心 ---
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

# --- 序列化 / 异步运行时 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"

# --- 数据库 ---
rusqlite = { version = "0.31", features = ["bundled"] }
parking_lot = "0.12"

# --- 图像处理 ---
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# SVG 渲染：resvg / usvg 必须同版本对齐（tiny-skia 由 usvg/resvg 间接拉取，
# 当前 0.48 系列对应 tiny-skia 0.12）。升级前已确认 call site（ai_commands.rs
# render_svg_to_png_internal）保持 0.43 → 0.48 的源码兼容，唯一变化是
# tiny_skia::Pixmap::encode_png 返回的 Err 类型不同（仍实现 std::error::Error，
# 可被 anyhow::Result 自动接管）。
resvg = "=0.48.1"
usvg = "=0.48.1"
base64 = "0.22"

# --- 系统 ---
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- 进程间通信 ---
rmp-serde = "1"

# --- HTTP 客户端（Week 5：真实 LLM 调用） ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
futures-util = "0.3"

# --- 阶段二/三 引入（特性开关） ---
lancedb = { version = "0.23", optional = true }

[features]
# 默认特性
default = []

# 启用 LanceDB 向量搜索（阶段三）
vector-search = ["lancedb"]

# MCP 服务器模式
mcp-server = []

# 自定义协议（截图、文件读取）
custom-protocol = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
