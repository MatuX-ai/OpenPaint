name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ----------------------------------------------------------
  # 前端 Lint / Type Check / Build
  # ----------------------------------------------------------
  frontend:
    name: Frontend (lint / type-check / build)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install dependencies (bootstrap if no lockfile)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      # Prettier 检查移到了独立的 frontend-fmt-fix job（自动修复+push）
      # 这里跳过 format check，否则会因代码未格式化而失败

      - name: Build
        run: pnpm build:web

      - name: Unit Test
        run: pnpm test:unit

  # ----------------------------------------------------------
  # Rust 后端：fmt / clippy / test / build
  # ----------------------------------------------------------
  backend:
    name: Backend (fmt / clippy / test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (webkit2gtk-4.1)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Rust fmt 检查移到了独立的 backend-fmt-fix job（自动修复+push）
      # 这里跳过 fmt，否则会因代码未格式化而失败

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: src-tauri
        run: cargo test --all

      - name: Rust build (release smoke)
        working-directory: src-tauri
        run: cargo build --release

  # ----------------------------------------------------------
  # Prettier 自动修复（前端格式），与 backend-fmt-fix 同样的设计
  # 检测 HEAD commit 是不是 bot 自己的 commit → 跳过
  # ----------------------------------------------------------
  frontend-fmt-fix:
    name: Frontend prettier (auto-fix)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install JS deps (bootstrap if no lockfile)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Detect previous commit subject
        id: prev
        run: |
          LAST=$(git log -1 --pretty=%s HEAD)
          echo "last_commit=$LAST" >> "$GITHUB_OUTPUT"
          if [[ "$LAST" == "style: apply prettier (auto-fix from CI)" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check prettier
        if: steps.prev.outputs.skip == 'false'
        id: check
        run: |
          if pnpm format:check; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply prettier
        if: steps.prev.outputs.skip == 'false' && steps.check.outputs.needs_fix == 'true'
        run: pnpm format

      - name: Re-check prettier (after auto-fix, must be clean)
        if: steps.prev.outputs.skip == 'false' && steps.check.outputs.needs_fix == 'true'
        run: pnpm format:check

      - name: Commit and push auto-fix
        if: steps.prev.outputs.skip == 'false' && steps.check.outputs.needs_fix == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "style: apply prettier (auto-fix from CI)"
          git push

  # ----------------------------------------------------------
  # Rust fmt 自动修复（独立 job，避免和 backend 矩阵 race condition）
  # 只在 ubuntu 上跑，跑完 commit + push 自动格式化的代码
  # 防循环：如果最近一次 commit 已经是 bot auto-fix，跳过
  # ----------------------------------------------------------
  backend-fmt-fix:
    name: Backend fmt (auto-fix)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 只在 push 到 main 时跑，PR 上不跑（PR 不能直接 push）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Detect previous commit subject
        id: prev
        run: |
          LAST=$(git log -1 --pretty=%s HEAD)
          echo "last_commit=$LAST" >> "$GITHUB_OUTPUT"
          if [[ "$LAST" == "style: apply cargo fmt (auto-fix from CI)" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check fmt
        if: steps.prev.outputs.skip == 'false'
        id: check
        working-directory: src-tauri
        run: |
          if cargo fmt --all -- --check; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply fmt
        if: steps.prev.outputs.skip == 'false' && steps.check.outputs.needs_fix == 'true'
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Re-check fmt (after auto-fix, must be clean)
        if: steps.prev.outputs.skip == 'false' && steps.check.outputs.needs_fix == 'true'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Commit and push auto-fix
        if: steps.prev.outputs.skip == 'false' && steps.check.outputs.needs_fix == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src-tauri/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "style: apply cargo fmt (auto-fix from CI)"
          git push

  # ----------------------------------------------------------
  # Conventional Commits 校验
  # ----------------------------------------------------------
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v5
        with:
          configFile: .commitlintrc.json