# ============================================================
# OpenPaint Desktop Release
# ============================================================
# 触发：推送形如 v0.1.0 的 git tag
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 行为：
#   - ubuntu-latest  → 生成 .deb / .AppImage
#   - windows-latest  → 生成 .msi / .exe（NSIS）
#   - macos-latest    → 生成 .dmg / .app
#   - 每个平台独立 job；artifacts 直接 attach 到同名的 GitHub Release
#   - 公开发布（不签名）作为 MVP 默认；如需签名请见 DEVELOPMENT.md
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------
  # 版本一致性校验：git tag 必须与 tauri.conf.json / Cargo.toml /
  # package.json 三处版本一致（SemVer），防止发布错误版本。
  # 用法：node scripts/version.mjs 0.2.0 同步三处后，再 git tag v0.2.0
  # ----------------------------------------------------------
  verify-version:
    name: Verify tag matches project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version consistency (tauri.conf.json / Cargo.toml / package.json / git tag)
        env:
          TAG_REF: ${{ github.ref_name }}
          TAG_INPUT: ${{ github.event.inputs.version }}
        run: |
          # Use manual input if provided (workflow_dispatch), otherwise use the tag ref
          TAG_VERSION="${TAG_INPUT:-${TAG_REF#refs/tags/}}"
          # Extract version from tauri.conf.json
          VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' src-tauri/tauri.conf.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Project version: $VERSION"
          echo "Git tag:         v$TAG_VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: version mismatch!"
            exit 1
          fi
          echo "Version check passed"

  # ----------------------------------------------------------
  # Linux：deb / AppImage
  # ----------------------------------------------------------
  linux:
    name: Linux (.deb / .AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (webkit2gtk-4.1)
        run: |
          for i in 1 2 3; do
            echo "=== apt-get update attempt $i ==="
            sudo apt-get update && break || echo "apt-get update failed"
            sleep 3
          done
          for i in 1 2 3; do
            echo "=== apt-get install attempt $i ==="
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              build-essential \
              curl \
              wget \
              file \
              libssl-dev \
              libayatana-appindicator3-dev && break || echo "apt-get install failed"
            sleep 3
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install JS deps (bootstrap if no lockfile)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        run: pnpm build:web

      - name: Build Tauri (Linux)
        run: pnpm tauri build --bundles=deb

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: openpaint-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb

  # ----------------------------------------------------------
  # Windows：msi / nsis (.exe)
  # ----------------------------------------------------------
  windows:
    name: Windows (.msi / .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install JS deps (bootstrap if no lockfile)
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clean target dir (force fresh build)
        run: |
          if (Test-Path src-tauri/target) {
            Remove-Item -Recurse -Force src-tauri/target
            Write-Host "target directory cleaned"
          } else {
            Write-Host "target directory does not exist, nothing to clean"
          }

      - name: Build frontend
        shell: bash
        run: pnpm build:web

      - name: Build Tauri (Windows)
        shell: bash
        run: pnpm tauri build --bundles=msi,nsis

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: openpaint-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ----------------------------------------------------------
  # macOS：dmg / app
  # 注意：不签名 / 不公证。详见 DEVELOPMENT.md
  # ----------------------------------------------------------
  macos:
    name: macOS (.dmg / .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install JS deps (bootstrap if no lockfile)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        run: pnpm build:web

      - name: Build Tauri (macOS)
        run: pnpm tauri build --bundles=dmg,app

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: openpaint-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app