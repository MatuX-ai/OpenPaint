# ============================================================
# OpenPaint Desktop Release
# ============================================================
# 触发：推送形如 v0.1.0 的 git tag
#   git tag v0.1.0
#   git push origin v0.1.0
#
# 行为：
#   - ubuntu-latest  → 生成 .deb / .AppImage
#   - windows-latest  → 生成 .msi / .exe（NSIS）
#   - macos-latest    → 生成 .dmg / .app
#   - 每个平台独立 job；artifacts 直接 attach 到同名的 GitHub Release
#   - 公开发布（不签名）作为 MVP 默认；如需签名请见 DEVELOPMENT.md
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------
  # Linux：deb / AppImage
  # ----------------------------------------------------------
  linux:
    name: Linux (.deb / .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install JS deps (bootstrap if no lockfile)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (Linux)
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: openpaint-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ----------------------------------------------------------
  # Windows：msi / nsis (.exe)
  # ----------------------------------------------------------
  windows:
    name: Windows (.msi / .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install JS deps (bootstrap if no lockfile)
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (Windows)
        run: pnpm tauri build --bundles msi,nsis

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: openpaint-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # ----------------------------------------------------------
  # macOS：dmg / app
  # 注意：不签名 / 不公证。详见 DEVELOPMENT.md
  # ----------------------------------------------------------
  macos:
    name: macOS (.dmg / .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@8.15.0 --activate

      - name: Install JS deps (bootstrap if no lockfile)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found, frozen install"
            pnpm install --frozen-lockfile
          else
            echo "pnpm-lock.yaml NOT found, generating one"
            pnpm install
          fi

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (macOS)
        run: pnpm tauri build --bundles dmg,app

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: openpaint-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app