# ============================================================
# OpenPaint Issue Labels
# 同步到 GitHub Labels：https://github.com/your-org/openpaint/labels
# ============================================================

# --- 模块 ---
- name: 'module:canvas'
  color: '1d76db'
  description: '中央画布（Canvas Engine）相关'
- name: 'module:agent'
  color: '5319e7'
  description: 'AI 助理（Hermes Agent 集成）相关'
- name: 'module:gallery'
  color: '0e8a16'
  description: '图库管理（SQLite + 缩略图 + 向量搜索）相关'
- name: 'module:openpencil'
  color: 'fbca04'
  description: 'OpenPencil 嵌入相关'
- name: 'module:frontend'
  color: 'd93f0b'
  description: '前端 UI / 组件 / Store 相关'
- name: 'module:tools'
  color: 'c5def5'
  description: '原子工具（MCP）相关'
- name: 'module:build'
  color: 'bfd4f2'
  description: '构建 / 打包 / CI 相关'

# --- 优先级 ---
- name: 'priority:P0'
  color: 'b60205'
  description: '阻塞项，必须立即处理'
- name: 'priority:P1'
  color: 'd93f0b'
  description: 'MVP 必需，本阶段完成'
- name: 'priority:P2'
  color: 'fbca04'
  description: '后续阶段增强'

# --- 类型 ---
- name: 'type:bug'
  color: 'ee0701'
  description: 'Bug 报告'
- name: 'type:feature'
  color: '0e8a16'
  description: '新功能建议'
- name: 'type:refactor'
  color: 'c5def5'
  description: '代码重构'
- name: 'type:docs'
  color: '0075ca'
  description: '文档相关'
- name: 'type:question'
  color: 'cc317c'
  description: '提问 / 寻求帮助'

# --- 适合新手 ---
- name: 'good first issue'
  color: '7057ff'
  description: '适合首次贡献者'
- name: 'help wanted'
  color: '008672'
  description: '欢迎有经验开发者认领'

# --- 阶段 ---
- name: 'stage:mvp'
  color: 'fef2c0'
  description: '阶段一 MVP（1-3 周）'
- name: 'stage:assistant'
  color: 'bfdadc'
  description: '阶段二 AI 助理（4-6 周）'
- name: 'stage:smart'
  color: 'bfd4f2'
  description: '阶段三 智能增强（7-8 周）'
- name: 'stage:release'
  color: 'd4c5f9'
  description: '阶段四 发布（9-10 周）'

# --- 状态 ---
- name: 'status:blocked'
  color: '000000'
  description: '被阻塞，需要协助'
- name: 'status:in-progress'
  color: 'fbca04'
  description: '正在处理'
- name: 'status:needs-review'
  color: '1d76db'
  description: '等待 Review'
- name: 'status:ready-to-merge'
  color: '0e8a16'
  description: '可合并'